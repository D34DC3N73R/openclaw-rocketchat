name: CI

on:
  push:
    branches: [main, "security/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      # Layer 1: install deps WITHOUT running lifecycle scripts (defense-in-depth)
      - name: Install dependencies (ignore-scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Layer 3: validate lockfile (no off-registry URLs, integrity present)
      - name: Lint lockfile
        run: npm run lint:lockfile

      # Build only after lockfile validation passes — this runs prepack/build scripts
      # for our own code, which is trusted at this point.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
